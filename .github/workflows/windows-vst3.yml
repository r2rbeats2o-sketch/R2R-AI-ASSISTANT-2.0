name: Windows VST3 Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target R2RAIAssistant_VST3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: R2R-AI-ASSISTANT-2.0-Windows-VST3
          path: build/**/Release/VST3/**
          if-no-files-found: error
